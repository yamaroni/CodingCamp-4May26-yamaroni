<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="dashboard-grid">

      <!-- Greeting Widget -->
      <section class="widget" id="greeting-widget">
        <p id="greeting-text"></p>
        <p id="time-display"></p>
        <p id="date-display"></p>
      </section>

      <!-- Focus Timer Widget -->
      <section class="widget" id="timer-widget">
        <p id="timer-display">25:00</p>
        <button id="timer-start">Start</button>
        <button id="timer-stop">Stop</button>
        <button id="timer-reset">Reset</button>
        <div id="timer-banner" class="timer-banner hidden">Time's up!</div>
      </section>

      <!-- To-Do List Widget -->
      <section class="widget" id="todo-widget">
        <input type="text" id="todo-input" placeholder="Add a task…" />
        <button id="todo-add-btn">Add</button>
        <ul id="todo-list"></ul>
      </section>

      <!-- Quick Links Widget -->
      <section class="widget" id="links-widget">
        <input type="text" id="link-label-input" placeholder="Label" />
        <input type="text" id="link-url-input" placeholder="https://…" />
        <button id="link-add-btn">Add</button>
        <div id="links-container"></div>
      </section>

    </main>
    <script src="js/app.js" defer></script>
  </body>
</html>
